# Starts MySQL + the app together:  docker compose up --build
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ems_db
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-change_me_please}
    volumes:
      - mysql_data:/var/lib/mysql      # data survives container restarts
    ports:
      - "3307:3306"                    # host 3307 -> avoids clashing with a local MySQL on 3306
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD:-change_me_please}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/ems_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-change_me_please}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@123}
      HR_PASSWORD: ${HR_PASSWORD:-Hr@12345}
    ports:
      - "8080:8080"

volumes:
  mysql_data:
