<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login | WorkSmart Hub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/styles.css" rel="stylesheet">
</head>
<body>
<div class="container">
    <div class="row justify-content-center mt-5">
        <div class="col-md-4">
            <div class="card shadow p-4">
                <h2 class="text-center text-primary mb-1">WorkSmart Hub</h2>
                <p class="text-center text-muted mb-4">Sign in to the Employee Management System</p>

                <div id="registeredMsg" class="alert alert-success py-2 d-none" role="alert">
                    Account created. Please log in.
                </div>
                <div id="loginError" class="alert alert-danger py-2 d-none" role="alert"></div>

                <form id="loginForm">
                    <input type="text" id="username" class="form-control mb-3" placeholder="Username"
                           autocomplete="username" required autofocus>
                    <input type="password" id="password" class="form-control mb-3" placeholder="Password"
                           autocomplete="current-password" required>
                    <button type="submit" id="loginBtn" class="btn btn-primary w-100">Login</button>
                </form>
                <p class="text-center mt-3 mb-0">New here? <a href="/register.html">Create an account</a></p>
            </div>
        </div>
    </div>
</div>
<script src="/js/login.js"></script>
</body>
</html>
