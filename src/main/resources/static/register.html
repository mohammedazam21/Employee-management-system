<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign up | WorkSmart Hub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/styles.css" rel="stylesheet">
</head>
<body>
<div class="container">
    <div class="row justify-content-center mt-5">
        <div class="col-md-4">
            <div class="card shadow p-4">
                <h2 class="text-center text-primary mb-1">Create account</h2>
                <p class="text-center text-muted mb-4">New accounts get read-only access. An admin can upgrade your role later.</p>

                <div id="registerError" class="alert alert-danger py-2 d-none" role="alert"></div>

                <form id="registerForm">
                    <input type="text" id="username" class="form-control mb-3" placeholder="Username (3-30 characters)"
                           autocomplete="username" maxlength="30" required autofocus>
                    <input type="password" id="password" class="form-control mb-3" placeholder="Password (min 8 characters)"
                           autocomplete="new-password" maxlength="72" required>
                    <input type="password" id="confirm" class="form-control mb-3" placeholder="Confirm password"
                           autocomplete="new-password" maxlength="72" required>
                    <button type="submit" id="registerBtn" class="btn btn-primary w-100">Sign up</button>
                </form>
                <p class="text-center mt-3 mb-0">Already have an account? <a href="/login.html">Login</a></p>
            </div>
        </div>
    </div>
</div>
<script src="/js/register.js"></script>
</body>
</html>
