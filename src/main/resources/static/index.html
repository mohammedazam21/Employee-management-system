<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Employee Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/styles.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
</head>
<body class="container mt-4 mb-5">

<nav class="navbar navbar-dark bg-dark rounded shadow px-3">
    <a class="navbar-brand fw-bold" href="#">EMS Dashboard</a>
    <div class="d-flex align-items-center gap-2">
        <span id="userBadge" class="badge text-bg-secondary"></span>
        <button class="btn btn-light btn-sm" id="darkModeBtn">Dark Mode</button>
        <button class="btn btn-outline-light btn-sm" id="logoutBtn">Logout</button>
    </div>
</nav>

<div class="text-end text-dark mt-2"><small id="dateTime"></small></div>
<h1 class="text-center text-light mb-3 fw-bold">WorkSmart Hub Dashboard</h1>

<div id="alertBox" class="alert alert-danger d-none" role="alert"></div>

<!-- Add / Edit form -->
<div class="card shadow p-4 mb-4" id="formCard">
    <h5 id="formTitle" class="mb-3">Add Employee</h5>
    <form id="employeeForm" novalidate>
        <input type="hidden" id="employeeId">
        <div class="row g-2">
            <div class="col-md-6"><input type="text" id="name" class="form-control" placeholder="Name" maxlength="100" required></div>
            <div class="col-md-6"><input type="email" id="email" class="form-control" placeholder="Email" maxlength="150" required></div>
            <div class="col-md-6"><input type="text" id="role" class="form-control" placeholder="Role (e.g. Backend Developer)" maxlength="100"></div>
            <div class="col-md-6"><input type="text" id="phone" class="form-control" placeholder="Phone Number" maxlength="20"></div>
            <div class="col-md-4">
                <select id="department" class="form-select" required>
                    <option value="">Select Department</option>
                    <option value="IT">IT</option>
                    <option value="HR">HR</option>
                    <option value="FINANCE">Finance</option>
                    <option value="MARKETING">Marketing</option>
                </select>
            </div>
            <div class="col-md-4">
                <select id="status" class="form-select" required>
                    <option value="">Select Status</option>
                    <option value="ACTIVE">Active</option>
                    <option value="ON_LEAVE">On Leave</option>
                    <option value="RESIGNED">Resigned</option>
                </select>
            </div>
            <div class="col-md-4"><input type="number" id="salary" class="form-control" placeholder="Salary" min="0" step="0.01" required></div>
        </div>
        <div class="mt-3">
            <button type="submit" id="submitBtn" class="btn btn-primary">Add Employee</button>
            <button type="button" id="cancelEditBtn" class="btn btn-secondary d-none">Cancel</button>
        </div>
    </form>
</div>

<!-- Stats -->
<div class="row g-3 mb-4">
    <div class="col-6 col-md"><div class="card stat-card bg-primary text-white shadow"><div class="card-body"><h6>Total Employees</h6><h2 id="totalEmployees">0</h2></div></div></div>
    <div class="col-6 col-md"><div class="card stat-card bg-success text-white shadow"><div class="card-body"><h6>IT</h6><h2 id="itCount">0</h2></div></div></div>
    <div class="col-6 col-md"><div class="card stat-card bg-dark text-white shadow"><div class="card-body"><h6>HR</h6><h2 id="hrCount">0</h2></div></div></div>
    <div class="col-6 col-md"><div class="card stat-card bg-warning text-dark shadow"><div class="card-body"><h6>Finance</h6><h2 id="financeCount">0</h2></div></div></div>
    <div class="col-6 col-md"><div class="card stat-card bg-info text-white shadow"><div class="card-body"><h6>Marketing</h6><h2 id="marketingCount">0</h2></div></div></div>
</div>

<div class="card shadow p-4 mb-4">
    <h5 class="text-center mb-3">Employees by Department</h5>
    <div style="max-height: 320px"><canvas id="employeeChart"></canvas></div>
</div>

<!-- Toolbar -->
<div class="row g-2 mb-3">
    <div class="col-md-5"><input type="text" id="searchInput" class="form-control" placeholder="Search by name or email"></div>
    <div class="col-md-2">
        <select id="filterDepartment" class="form-select">
            <option value="">All Departments</option>
            <option value="IT">IT</option><option value="HR">HR</option>
            <option value="FINANCE">Finance</option><option value="MARKETING">Marketing</option>
        </select>
    </div>
    <div class="col-md-2">
        <select id="filterStatus" class="form-select">
            <option value="">All Statuses</option>
            <option value="ACTIVE">Active</option><option value="ON_LEAVE">On Leave</option><option value="RESIGNED">Resigned</option>
        </select>
    </div>
    <div class="col-md-3 text-md-end"><button id="pdfBtn" class="btn btn-success">Download PDF</button></div>
</div>

<div id="loadingSpinner" class="text-center my-3"><div class="spinner-border text-light"></div></div>

<div class="table-responsive">
    <table class="table table-bordered table-striped align-middle">
        <thead class="table-dark">
        <tr>
            <th class="sortable" data-sort="id">ID</th>
            <th class="sortable" data-sort="name">Name</th>
            <th class="sortable" data-sort="email">Email</th>
            <th class="sortable" data-sort="department">Department</th>
            <th class="sortable" data-sort="salary">Salary</th>
            <th>Role</th>
            <th>Phone</th>
            <th class="sortable" data-sort="status">Status</th>
            <th>Action</th>
        </tr>
        </thead>
        <tbody id="employeeTable"></tbody>
    </table>
</div>

<div class="d-flex justify-content-center align-items-center gap-3 mt-3">
    <button id="prevBtn" class="btn btn-dark">Previous</button>
    <span id="pageInfo" class="fw-bold">Page 1 of 1</span>
    <button id="nextBtn" class="btn btn-dark">Next</button>
</div>

<!-- Admin only: manage who has which role -->
<div id="userAdminCard" class="card shadow p-4 mt-5 d-none">
    <h5 class="mb-3">Manage Users <small class="text-muted">(admin only)</small></h5>
    <div class="table-responsive">
        <table class="table table-bordered align-middle mb-0">
            <thead class="table-dark"><tr><th>ID</th><th>Username</th><th>Role</th></tr></thead>
            <tbody id="userTable"></tbody>
        </table>
    </div>
</div>

<div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="appToast" class="toast align-items-center text-bg-success border-0" role="alert">
        <div class="d-flex">
            <div class="toast-body" id="toastBody">Done</div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
