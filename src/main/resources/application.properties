spring.application.name=employee-management-system

# ---- MySQL (override with environment variables, never hardcode real passwords) ----
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ems_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# update = Hibernate creates/updates tables automatically (fine for a learning project).
# For production you would use Flyway migrations and set this to "validate".
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---- Session cookie hardening ----
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m

# ---- Demo data (users are created on first start if the table is empty) ----
app.seed.admin-password=${ADMIN_PASSWORD:Admin@123}
app.seed.hr-password=${HR_PASSWORD:Hr@12345}
app.seed.sample-data=${SEED_SAMPLE_DATA:true}
